<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-label="Without CFD every session starts from zero and you re-explain, re-correct and re-argue. With CFD each session writes what it learned into the repo and the next one reads it back.">
<title>Without CFD every session starts from zero and you re-explain, re-correct and re-argue. With CFD each session writes what it learned into the repo and the next one reads it back.</title>
