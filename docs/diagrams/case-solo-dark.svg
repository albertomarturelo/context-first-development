<text x="54" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#969CAB" text-anchor="start">1</text>
<text x="54" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#E9EAF0" text-anchor="start">/session-start</text>
<text x="54" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#969CAB" text-anchor="start">reads STATUS +</text>
<text x="54" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#969CAB" text-anchor="start">decisions index</text>
<path d="M180 170.0 L196 170.0" fill="none" stroke="#969CAB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-muted)"/>
<rect x="198" y="120" width="136" height="100" rx="10" fill="#171A22" stroke="#2B303C" stroke-width="1"/>
<text x="210" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#969CAB" text-anchor="start">2</text>
<text x="210" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#E9EAF0" text-anchor="start">/issue-start N</text>
<text x="210" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#969CAB" text-anchor="start">loads the AC</text>
<text x="210" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#969CAB" text-anchor="start">+ its ADRs</text>
<path d="M336 170.0 L352 170.0" fill="none" stroke="#969CAB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-muted)"/>
<rect x="354" y="120" width="136" height="100" rx="10" fill="#171A22" stroke="#2B303C" stroke-width="1"/>
<text x="366" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#969CAB" text-anchor="start">3</text>
<text x="366" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#E9EAF0" text-anchor="start">implement</text>
<text x="366" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#969CAB" text-anchor="start">one AC item</text>
<text x="366" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#969CAB" text-anchor="start">at a time</text>
<path d="M492 170.0 L508 170.0" fill="none" stroke="#969CAB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-muted)"/>
<rect x="510" y="120" width="136" height="100" rx="10" fill="#171A22" stroke="#2B303C" stroke-width="1"/>
<text x="522" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#969CAB" text-anchor="start">4</text>
<text x="522" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#E9EAF0" text-anchor="start">/review-pr</text>
<text x="522" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#969CAB" text-anchor="start">self-review the diff;</text>
<text x="522" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#969CAB" text-anchor="start">fix findings now</text>
<path d="M648 170.0 L664 170.0" fill="none" stroke="#969CAB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-muted)"/>
<rect x="666" y="120" width="136" height="100" rx="10" fill="#171A22" stroke="#F0A93E" stroke-width="2"/>
<text x="678" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#F0A93E" text-anchor="start">5</text>
<text x="678" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#E9EAF0" text-anchor="start">/session-close</text>
<text x="678" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#969CAB" text-anchor="start">STATUS + docs ship</text>
<text x="678" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#969CAB" text-anchor="start">with code; PR opens</text>
<path d="M804 170.0 L820 170.0" fill="none" stroke="#969CAB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-muted)"/>
<rect x="822" y="120" width="136" height="100" rx="10" fill="#171A22" stroke="#2B303C" stroke-width="1"/>
<text x="834" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#969CAB" text-anchor="start">6</text>
<text x="834" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#E9EAF0" text-anchor="start">merge</text>
<text x="834" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#969CAB" text-anchor="start">closes the issue</text>
<text x="734.0" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#F0A93E" text-anchor="middle">the habit that makes it work</text>
<rect x="214" y="280" width="236" height="64" rx="10" fill="#1E222D" stroke="#2B303C" stroke-width="1" stroke-dasharray="5 4"/>
<text x="228" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#E9EAF0" text-anchor="start">You correct a pattern</text>
<text x="228" y="328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#969CAB" text-anchor="start">→ rule in CONVENTIONS.md</text>
<rect x="470" y="280" width="236" height="64" rx="10" fill="#1E222D" stroke="#2B303C" stroke-width="1" stroke-dasharray="5 4"/>
<text x="484" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#E9EAF0" text-anchor="start">A decision surfaces</text>
<text x="484" y="328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#969CAB" text-anchor="start">→ /new-decision, ADR first</text>
