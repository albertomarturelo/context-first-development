<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450" role="img" aria-label="The solo loop: start, pick one issue, implement, review the local diff yourself, fix the findings, close, open the PR, merge; corrections and decisions are written down as they happen.">
<title>The solo loop: start, pick one issue, implement, review the local diff yourself, fix the findings, close, open the PR, merge; corrections and decisions are written down as they happen.</title>
<defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#969CAB"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F0A93E"/></marker><marker id="a-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E9EAF0"/></marker><marker id="a-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#63B9AB"/></marker><marker id="a-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC7A70"/></marker><pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse"><path d="M46 0 L0 0 0 46" fill="none" stroke="#E9EAF0" stroke-opacity="0.04"/></pattern></defs>
<rect x="0.5" y="0.5" width="999" height="449" rx="14" fill="#0F1118" stroke="#2B303C"/>
<rect x="0.5" y="0.5" width="999" height="449" rx="14" fill="url(#grid)"/>
<text x="40" y="46" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#969CAB" text-anchor="start">CASE 1 · ONE DEVELOPER, ONE REPO</text>
<text x="40" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#E9EAF0" text-anchor="start">One loop. One issue per session.</text>
