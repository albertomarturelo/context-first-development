<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" role="img" aria-label="Several agents, one source: CLAUDE.md and .agents/skills are the only copies; AGENTS.md and .claude/skills are symlinks, so every agent reads the same context from the path it expects.">
<title>Several agents, one source: CLAUDE.md and .agents/skills are the only copies; AGENTS.md and .claude/skills are symlinks, so every agent reads the same context from the path it expects.</title>
<defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#565B68"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8690F"/></marker><marker id="a-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#171921"/></marker><marker id="a-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2C7A6B"/></marker><marker id="a-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#AF463C"/></marker><pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse"><path d="M46 0 L0 0 0 46" fill="none" stroke="#171921" stroke-opacity="0.04"/></pattern></defs>
<rect x="0.5" y="0.5" width="999" height="459" rx="14" fill="#E7E8EC" stroke="#CBCFD8"/>
<rect x="0.5" y="0.5" width="999" height="459" rx="14" fill="url(#grid)"/>
<text x="40" y="46" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#565B68" text-anchor="start">CASE 4 · SEVERAL AGENTS, ONE SOURCE</text>
<text x="40" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#171921" text-anchor="start">One copy of the context. Every agent finds it where it looks.</text>
