<text x="340" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#A8690F" text-anchor="start">CLAUDE.md</text>
<text x="340" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#565B68" text-anchor="start">the index · the only copy</text>
