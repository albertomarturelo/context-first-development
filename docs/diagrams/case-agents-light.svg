<path d="M596 241 L676 241" fill="none" stroke="#565B68" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-muted)"/>
<text x="636" y="231" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#565B68" text-anchor="middle">read by</text>
<text x="636" y="261" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#565B68" text-anchor="middle">every agent</text>
<text x="680" y="392" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#565B68" text-anchor="start">* one config line; see the per-agent table</text>
<rect x="40" y="404" width="920" height="40" rx="10" fill="#F2F3F6" stroke="#CBCFD8" stroke-width="1"/>
<text x="58" y="429" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#565B68" text-anchor="start">CI runs the same checks on every PR, whichever agent wrote it. Hooks are a Claude Code bonus, not the guarantee.</text>
</svg>
