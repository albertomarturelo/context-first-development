<rect x="680" y="176" width="280" height="56" rx="10" fill="#F2F3F6" stroke="#CBCFD8" stroke-width="1"/>
<text x="696" y="199" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#171921" text-anchor="start">Codex</text>
<text x="696" y="219" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#565B68" text-anchor="start">AGENTS.md · .agents/skills · $name</text>
