services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cfd
      POSTGRES_PASSWORD: cfd
      POSTGRES_DB: cfd_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cfd -d cfd_test"]
      interval: 2s
      timeout: 5s
      retries: 10
